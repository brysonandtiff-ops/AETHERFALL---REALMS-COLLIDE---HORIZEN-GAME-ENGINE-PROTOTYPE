name: AETHERFALL Source Safety and Native Godot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Needed for exact PR base-to-head change detection
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate source and migration boundary
        run: python3 tools/validate_structure.py
      - name: Verify portable file layout and Godot references
        run: python3 tools/structure_guard.py check
      - name: Protect pre-existing files and asset IDs against PR base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          AETHERFALL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 tools/structure_guard.py diff --base "$AETHERFALL_BASE_SHA"
      - name: Check S.I.R.E. contract, command routing and work-order honesty
        run: python3 tools/aetherfall.py doctor --json
      - name: Run adversarial standard-library tests
        run: python3 -m unittest discover -s tests -v
      - name: Create and recheck unsigned, source-only S.I.R.E. integrity receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [[ -z "$REVIEW_BASE" || "$REVIEW_BASE" =~ ^0+$ ]]; then
            REVIEW_BASE="$(git rev-parse HEAD^)"
          fi
          python3 tools/sire_seal.py source --base "$REVIEW_BASE" --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/aetherfall-source-integrity.json"
          python3 tools/sire_seal.py verify --receipt "$RUNNER_TEMP/aetherfall-source-integrity.json" --expected-head "$EXPECTED_HEAD"
      - name: Archive source integrity receipt (NOT a signed release seal)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aetherfall-source-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/aetherfall-source-integrity.json
          if-no-files-found: error
          retention-days: 7

  native-godot-4-7-2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout read-only source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact candidate Git commit before native smoke
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Download and SHA256-verify official native Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 \
            -o /tmp/aetherfall-godot.zip \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/aetherfall-godot.zip' | sha256sum --check
          mkdir -p /tmp/aetherfall-godot
          unzip -q /tmp/aetherfall-godot.zip -d /tmp/aetherfall-godot
          chmod +x /tmp/aetherfall-godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Genuine headless import and five-frame project boot (not visual/gameplay proof)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/aetherfall-godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --version | tee /tmp/aetherfall-version.log
          grep -q '^4\.7\.2\.stable' /tmp/aetherfall-version.log
          "$GODOT" --headless --path game --editor --import --quit 2>&1 | tee /tmp/aetherfall-import.log
          "$GODOT" --headless --path game --quit-after 5 2>&1 | tee /tmp/aetherfall-boot.log
          if grep -Eiq '(^|[[:space:]])(ERROR|FATAL):' /tmp/aetherfall-import.log /tmp/aetherfall-boot.log; then
            echo 'Godot logged an error during real headless launch' >&2
            exit 1
          fi
          echo 'PASS: exact-version native Godot import/boot; no graphic, animation, device or gameplay proof'
      - name: Preserve original Godot headless logs as evidence (not graphical video)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aetherfall-godot-headless-${{ github.run_id }}
          path: |
            /tmp/aetherfall-version.log
            /tmp/aetherfall-import.log
            /tmp/aetherfall-boot.log
          if-no-files-found: error
          retention-days: 7

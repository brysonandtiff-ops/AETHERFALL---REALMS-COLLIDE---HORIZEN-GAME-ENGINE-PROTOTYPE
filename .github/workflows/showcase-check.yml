name: AETHERFALL Showcase source checks

on:
  pull_request:
    paths:
      - 'docs/showcase/**'
      - 'tests/showcase.test.mjs'
      - '.github/workflows/showcase-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test worker responses and served character filter
        run: node --test tests/showcase.test.mjs
